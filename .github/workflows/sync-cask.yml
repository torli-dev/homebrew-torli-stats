name: Sync Community Cask

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-community-cask
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update from latest public Community release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/sync-cask.sh
      - name: Commit updated Cask
        run: |
          if git diff --quiet -- Casks/torli-stats.rb; then
            echo 'Cask is up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/torli-stats.rb
          git commit -m 'Update Community Cask'
          git push
